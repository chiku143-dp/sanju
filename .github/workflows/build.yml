name: Build SANJU APK

on:
  workflow_dispatch:
  push:
    paths:
      - "SANJU_V1_FEMALE_VOICE.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract SANJU project
        run: |
          rm -rf sanju_project
          mkdir sanju_project
          unzip -q SANJU_V1_FEMALE_VOICE.zip -d sanju_project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find sanju_project -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Android project found at: $PROJECT_DIR"

      - name: Build SANJU APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload SANJU APK
        uses: actions/upload-artifact@v4
        with:
          name: SANJU-APK
          path: sanju_project/**/build/outputs/apk/debug/*.apk
