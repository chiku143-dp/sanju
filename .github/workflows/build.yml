name: Build SANJU APK

on:
  workflow_dispatch:
  push:
    paths:
      - "SANJU_V1_FEMALE_VOICE.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract SANJU project
        run: |
          rm -rf sanju_project
          mkdir sanju_project
          unzip -q SANJU_V1_FEMALE_VOICE.zip -d sanju_project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure JVM 17
        run: |
          cd sanju_project

          cat >> app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }
          EOF

      - name: Build SANJU APK
        run: |
          cd sanju_project
          gradle assembleDebug --stacktrace

      - name: Upload SANJU APK
        uses: actions/upload-artifact@v4
        with:
          name: SANJU-APK
          path: sanju_project/app/build/outputs/apk/debug/*.apk
