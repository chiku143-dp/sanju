name: Build SANJU APK

on:
  workflow_dispatch:
  push:
    paths:
      - "SANJU_V1_FEMALE_VOICE.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract SANJU project
        run: |
          rm -rf sanju_project
          mkdir sanju_project
          unzip -q SANJU_V1_FEMALE_VOICE.zip -d sanju_project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fix JVM target
        run: |
          cd sanju_project
          find . -name "*.gradle.kts" -type f -exec sed -i \
            's/jvmTarget *= *"1.8"/jvmTarget = "17"/g' {} \;

      - name: Build SANJU APK
        run: |
          cd sanju_project
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload SANJU APK
        uses: actions/upload-artifact@v4
        with:
          name: SANJU-APK
          path: sanju_project/app/build/outputs/apk/debug/*.apk
